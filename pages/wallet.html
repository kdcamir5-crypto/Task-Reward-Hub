<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Task Reward Hub - ওয়ালেট</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/tasks.css">
  <link rel="stylesheet" href="../css/wallet.css">
</head>
<body>
  <div class="app">
    <header class="top"><strong>ওয়ালেট</strong><a class="icon-btn" href="dashboard.html" style="text-decoration:none">ড্যাশবোর্ড</a></header>
    <section class="wcard"><span>উইথড্র-যোগ্য ব্যালেন্স</span><strong id="bal">৳ 0.00</strong></section>

    <section class="box">
      <h3>যুক্ত ই-ওয়ালেট</h3>
      <div id="wallets"></div>
    </section>

    <section class="box" id="bind-box">
      <h3>নতুন ই-ওয়ালেট যুক্ত করুন</h3>
      <form id="bind" novalidate>
        <select id="type" aria-label="ওয়ালেটের ধরন"><option>bKash</option><option>Nagad</option><option>Rocket</option></select>
        <input id="num" inputmode="numeric" maxlength="11" placeholder="01XXXXXXXXX" aria-label="মোবাইল নম্বর">
        <p class="warn">নিজের পার্সোনাল নম্বর দিন। একবার যুক্ত করলে বদলানো যাবে না। সর্বোচ্চ ৫টা।</p>
        <button class="go" type="submit">যুক্ত ও লক করুন</button>
        <p class="msg2" id="bmsg" role="status"></p>
      </form>
    </section>

    <section class="box">
      <h3>উইথড্র রিকোয়েস্ট</h3>
      <form id="wd" novalidate>
        <select id="dest" aria-label="কোন ওয়ালেটে নেবেন"></select>
        <input id="amt" type="number" inputmode="numeric" min="1" placeholder="পরিমাণ (৳)" aria-label="পরিমাণ">
        <p class="warn">ন্যূনতম <span id="minlabel"></span>। অ্যাডমিন যাচাই করে পাঠাবেন।</p>
        <button class="go" type="submit">রিকোয়েস্ট পাঠান</button>
        <p class="msg2" id="wmsg" role="status"></p>
      </form>
    </section>

    <section class="box">
      <h3>উইথড্র ইতিহাস</h3>
      <div id="hist"></div>
    </section>

    <div style="height:8px"></div>
    <nav class="nav" aria-label="প্রধান মেনু">
      <a href="dashboard.html">হোম</a>
      <a href="tasks.html">টাস্ক</a>
      <a href="#">ফিড</a>
      <a href="profile.html">প্রোফাইল</a>
    </nav>
  </div>
  <script src="../js/storage.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/guard.js"></script>
  <script src="../js/wallet.js"></script>
</body>
</html>
