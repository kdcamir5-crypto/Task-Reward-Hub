name: Firestore Profile Rules Test
on:
  push:
    branches: [main]
    paths:
      - 'firebase.rules'
      - 'tests/profile.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/profile-rules-test.yml'
  workflow_dispatch:
jobs:
  profile-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Firestore profile rules emulator tests
        run: npm run test:profile
