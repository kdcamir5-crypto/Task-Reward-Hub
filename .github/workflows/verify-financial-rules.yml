name: Verify financial rules in emulator
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-financial-rules.yml
      - firebase.rules
      - tests/purchases.cjs
      - tests/withdrawals.cjs
      - tests/maintenance-candidate.rules
      - tests/maintenance-purchases.cjs
      - tests/maintenance-withdrawals.cjs
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test bot purchases
        run: npm run test:purchases
      - name: Test withdrawals
        run: npm run test:withdrawals
      - name: Test maintenance purchase and deposit controls
        run: npx firebase emulators:exec --only firestore --project demo-trh-purchase 'node tests/maintenance-purchases.cjs'
      - name: Test maintenance withdrawal controls
        run: npx firebase emulators:exec --only firestore --project demo-trh-withdrawals 'node tests/maintenance-withdrawals.cjs'
