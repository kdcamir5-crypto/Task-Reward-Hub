name: Verify daily tasks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-daily-tasks.yml
      - js/daily-tasks*.js
      - js/dashboard.js
      - js/spin-core.js
      - workers/telegram-auth.mjs
      - scripts/prepare-spin-rewards.cjs
      - tests/spin*
      - js/spin-sound.js
      - tests/spin-sound.test.cjs
      - pages/dashboard.html
      - js/activity-core.js
      - js/activity-paged-core.js
      - js/activity-router.js
      - tests/activity-pagination.test.cjs
      - tests/activity-router.test.cjs
      - tests/activity-rules.cjs
      - js/notifications-core.js
      - scripts/cleanup-daily-tasks.cjs
      - tests/daily-tasks*
      - tests/task-realtime.test.cjs
      - tests/tap-input.test.cjs
      - tests/tap-200.test.cjs
      - firebase.rules
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Instant spin and authentication regression
        run: node --test tests/spin-instant.test.mjs tests/spin-ui.test.cjs tests/telegram-auth.test.mjs tests/recovery-auth.test.mjs
      - name: Secure spin transactions and provisioning
        run: npm run test:spin
      - name: Spin sound
        run: node --test tests/spin-sound.test.cjs
      - name: Tap input and daily goal
        run: node --test tests/tap-input.test.cjs tests/tap-200.test.cjs
      - name: Task boundaries and visibility
        run: node --test tests/task-realtime.test.cjs tests/daily-tasks.test.cjs tests/daily-tasks-ui.test.cjs tests/daily-tasks-routing.test.cjs tests/activity.test.cjs tests/activity-pagination.test.cjs tests/activity-router.test.cjs tests/notifications.test.cjs
      - name: Activity history owner rules and realtime paging
        run: npx firebase emulators:exec --only firestore --project demo-trh-activity 'node tests/activity-rules.cjs'
      - name: Daily task rules and transactions
        run: npx firebase emulators:exec --only firestore --project demo-trh-daily-tasks 'node tests/daily-tasks.cjs'
      - name: Regression purchases and withdrawals
        run: |
          npm run test:purchases
          npm run test:withdrawals

