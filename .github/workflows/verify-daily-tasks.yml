name: Verify daily tasks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-daily-tasks.yml
      - js/daily-tasks*.js
      - js/activity-core.js
      - js/notifications-core.js
      - scripts/cleanup-daily-tasks.cjs
      - tests/daily-tasks*
      - firebase.rules
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Task boundaries and visibility
        run: node --test tests/daily-tasks.test.cjs tests/daily-tasks-ui.test.cjs tests/activity.test.cjs tests/notifications.test.cjs
      - name: Candidate task rules and transactions
        run: npx firebase emulators:exec --only firestore --project demo-trh-daily-tasks 'node tests/daily-tasks.cjs'
      - name: Regression purchases and withdrawals against candidate rules
        run: |
          cp tests/daily-tasks-candidate.rules firebase.rules
          npm run test:purchases
          npm run test:withdrawals
